log_level: info

# log also safe ips
log_safe_ips: false

# live stream retention in days
live_stream_retention_days: 7

# if fail_open is true, the server will allow traffic even if the threat source is not available
# if fail_open is false, the server will block traffic if the threat source is not available
fail_open: true

server:
  port: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  read_header_timeout: 2s

AbuseIPDB:
  enabled: true
  api_key: "YOUR_API_KEY_HERE"
  expiration_time: 24h
  confidence_score_threshold: 50 # if the confidence score is greater than this threshold, the IP is considered a threat
  cache_max_size: 1000 # maximum number of entries in the cache
  circuit_breaker:
    max_retries: 3
    cool_down_period: 30s
    open_on_error: true

active_defence:
  enabled: true
  expiration_time: "permanent"
  honeytoken_paths:
    - '\.env'
    - '\.git/'
    - '\.vscode/'
    - 'sftp-config\.json'
    - '\.aws/credentials'
    - '(credentials|firebase|service-account|client_secret|gcp-credentials|secrets|keyfile|sa-key|application_default_credentials|service-account-key|sa-private-key|gcp-service-account)\.json$'
    - 'secrets\.yml$'
    - 'wp-login\.php'
    - 'xmlrpc\.php'
    - '(txets|chosen|bless|blurbs|akcc|abcd|shelp|cord|dex|bolt|cjfuns|zwso|ioxi-o|insc|classwithtostring|goods|lufix|style)\.php'
    - 'phpinfo'
    - 'laravel\.log$'
  # Automatically report detected IPs to AbuseIPDB
  auto_report: false
  # AbuseIPDB category IDs. Default: 21 (Web App Attack)
  report_categories:
    - 21
  # Custom comment template sent with the report (will append the matched path automatically)
  report_comment: "Honeytoken tripped"