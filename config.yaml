log_level: info

# log also safe ips
log_safe_ips: false

# live stream retention in days
live_stream_retention_days: 7

# if fail_open is true, the server will allow traffic even if the threat source is not available
# if fail_open is false, the server will block traffic if the threat source is not available
fail_open: true

server:
  port: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  read_header_timeout: 2s

AbuseIPDB:
  enabled: true
  api_key: "YOUR_API_KEY_HERE"
  expiration_time: 24h
  confidence_score_threshold: 50 # if the confidence score is greater than this threshold, the IP is considered a threat
  cache_max_size: 1000 # maximum number of entries in the cache
  circuit_breaker:
    max_retries: 3
    cool_down_period: 30s
    open_on_error: true

active_defence:
  # WARNING: Active Defence automatically blocks IPs that access any of the paths listed in honeytoken_paths.
  # If enabled: true, any matching request will result in a block for the duration specified in expiration_time (e.g. "48h").
  # Ensure you do NOT include paths that are legitimately used by your application or developers,
  # otherwise you will block yourselves or legitimate users.
  enabled: true
  expiration_time: "48h"
  
  # WARNING: Review and modify these paths carefully.
  # If your application serves wordpress files, phpinfo, or has custom routes resembling these,
  # remove them from this list to prevent accidental blocks.
  honeytoken_paths:
    - '\.env'
    - '\.git/'
    - '\.vscode/'
    - 'sftp-config\.json'
    - '\.aws/credentials'
    - '(credentials|firebase|service-account|client_secret|gcp-credentials|secrets|keyfile|sa-key|application_default_credentials|service-account-key|sa-private-key|gcp-service-account)\.json$'
    - 'secrets\.yml$'
    - 'wp-login\.php'
    - 'xmlrpc\.php'
    - '(txets|chosen|bless|blurbs|akcc|abcd|shelp|cord|dex|bolt|cjfuns|zwso|ioxi-o|insc|classwithtostring|goods|lufix|style|k|g|as|cah|acp|a1|xwx1|sadcut1|3PJcpMFsD8B|wp-block)\.php'
    - 'phpinfo'
    - 'laravel\.log$'
    - 'wp-(includes|content|admin)/'
    - 'templates/beez3/'
    - 'css/index\.php'
    - 'about/function\.php'
    - '\.info\.php'
  # Automatically report detected IPs to AbuseIPDB
  auto_report: false
  # AbuseIPDB category IDs. Default: 21 (Web App Attack)
  report_categories:
    - 21
  # Custom comment template sent with the report (will append the matched path automatically)
  report_comment: "Honeytoken tripped"