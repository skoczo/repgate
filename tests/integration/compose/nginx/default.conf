server {
    listen 80;
    server_name localhost;

    error_page 403 = /blocked.html;

    location / {
        auth_request /_auth;
        proxy_pass http://backend:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth {
        internal;
        proxy_pass http://repgate:8080/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Client-IP $http_x_client_ip;
    }

    location = /blocked.html {
        internal;
        default_type text/html;
        return 200 "<html><body><h1>Request blocked</h1><p>Your IP is not allowed.</p></body></html>";
    }
}