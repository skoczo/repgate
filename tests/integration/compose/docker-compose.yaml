services:
  nginx:
    image: nginx:latest
    depends_on:
      - repgate
      - backend
    ports:
      - "7070:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  repgate:
    build: ../../..
    entrypoint: ["/app/repgate", "-c", "/app/internal-config.yaml"]
    ports:
      - "8081:8080"
    volumes:
      - ../../../internal-config.yaml:/app/internal-config.yaml
      - data:/app/data
  backend:
    image: hashicorp/http-echo:latest
    command: ["-text=Hello from backend"]
    ports:
      - "8082:5678"

volumes:
  data: