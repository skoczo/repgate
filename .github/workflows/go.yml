# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Repgate CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: Coverage
      run: make coverage

    - name: Commit badge
      run: |
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add README.md 
        git commit -m "update coverage badge" || exit 0
        git push 

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: docker build -t repgate:latest .

    - name: Push Docker image to GHCR
      run: docker tag repgate:latest ghcr.io/${{ github.repository_owner }}/repgate:latest && docker push ghcr.io/${{ github.repository_owner }}/repgate:latest
