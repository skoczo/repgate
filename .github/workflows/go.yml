# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Repgate CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  packages: write
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Build Frontend
      run: |
        npm ci --prefix web
        npm run build --prefix web

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: Test & Coverage
      run: |
        go test ./... -coverprofile=coverage.out -covermode=atomic
        grep -v "github.com/skoczo/repgate/cmd/" coverage.out > coverage.clean.out && mv coverage.clean.out coverage.out

    - name: Integration Tests
      env:
        ABUSEIPDB_TOKEN: ${{ secrets.ABUSEIPDB_TOKEN }}
      run: go test -tags=integration ./tests/integration/... -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: docker build -t repgate:latest .

    - name: Push Docker image to GHCR
      run: docker tag repgate:latest ghcr.io/${{ github.repository_owner }}/repgate:latest && docker push ghcr.io/${{ github.repository_owner }}/repgate:latest
